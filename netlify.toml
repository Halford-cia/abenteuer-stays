[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Guesty Booking Engine API calls run only in these functions. GUESTY_BE_CLIENT_ID and
# GUESTY_BE_CLIENT_SECRET are Netlify environment variables, never in the repo or the browser.
# Routes (/api/stays/:slug/calendar, /api/stays/:slug/quote) are declared in each function's config.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action https://www.airbnb.com"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/social/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
